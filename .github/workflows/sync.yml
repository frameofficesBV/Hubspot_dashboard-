name: Sync HubSpot

on:
  schedule:
    - cron: '0 8 * * *'  # elke dag om 08:00 UTC (= 10:00 NL zomertijd)
  workflow_dispatch:       # handmatig via knop of API

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Apps Script sync
        run: |
          curl -L -s "https://script.google.com/macros/s/AKfycbzWP15GnNGdzDZPn00xQMIANJ6MkM9DHu64bSAdfut49C82jyOZie3jNgYOPiKjVJRa/exec?action=sync"
